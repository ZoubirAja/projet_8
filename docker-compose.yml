services:
  minio:
    image: quay.io/minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET}
    ports:
      - "9002:9000"
      - "9092:9001"
    volumes:
      - minio_data:/data

  api:
    build: .
    env_file: .env
    environment:
      # Dans le réseau docker-compose, "minio" est le nom résolu du service ci-dessus
      # (port interne 9000 : voir la discussion host-port vs container-port).
      # Ne pas confondre avec S3_URL=http://localhost:9002 utilisé quand vous lancez
      # train.py/pytest directement sur l'hôte (hors conteneur).
      S3_URL: http://minio:9000
    ports:
      - "8000:7860"
    depends_on:
      - minio
    restart: on-failure

volumes:
  minio_data:
